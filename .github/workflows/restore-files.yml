# One-time: pull the files that exist only in the live Vercel deploy into the repo.
# Each file is checked against the SHA-1 Vercel holds for the live deployment, so only exact copies are committed.
name: Restore live-only files
on:
  push:
    paths: ['.github/workflows/restore-files.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -e
          fail=0
          while read -r sha path; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "https://www.corllet.com/$path?restore=$GITHUB_RUN_ID" -o "$path" || { echo "::error::download failed $path"; fail=1; continue; }
            got=$(sha1sum "$path" | cut -d' ' -f1)
            if [ "$got" = "$sha" ]; then echo "ok  $path"; else echo "::error::$path sha $got != $sha"; rm -f "$path"; fail=1; fi
          done <<'LIST'
          2e0f2be9edaac7111b14c8b073db431c1f555aa3 js/app.js
          76699da98263b470444c399062bd11f302a1bce6 js/data.js
          46885b587a997a50f787941c26e7998e79e2ffdb js/ui.js
          adae6cf0732b92ad7b1273f0ed59f25847faafbc js/phones.js
          6ca188106cdab6535797f812aa8a0523a063090f js/pages-public.js
          ebbb81d6d9b6c6530b4378f573f222cc2e86f2cb js/pages-account.js
          84d321c8dc61f242379dfd690ca4152e54d1d7a1 js/pages-admin.js
          c06679f30afa87faff0f282551b1a1c6379f1020 js/pages-browse.js
          935a477501267fa084523423fee3c4bf5f09d434 js/pages-contribute.js
          22b65c4a4da22f922e182fc3b6c9cf654c1baf19 styles.css
          29111e8834e19b68c4c54a42f9ee5786803a6926 type.css
          f3b53283ced08843cd677e7e54f906233a0f647d favicon.svg
          af3f999498eabd0f0c846d350fe3d560dd73be4e img/hero-1.jpg
          27b3f9108512931cc7bd01eceb816e3922538ea7 img/hero-2.jpg
          LIST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js styles.css type.css favicon.svg img
          git diff --cached --quiet || git commit -m "Restore files that existed only in the live Vercel deploy (SHA-1 verified)"
          git push
          exit $fail
